	<script>	
		const map = document.querySelector("#map");
				
		document.querySelector("#night-toggle").addEventListener("click", () => {
			map.classList.toggle("night");
		});
		
		closemodal.addEventListener('click',function(){
			console.log("Close");
			modal.close();
		});
		market.addEventListener('click',function(){
			modal.showModal();
		});
		
		const originalView = {
    x: map.viewBox.baseVal.x,
    y: map.viewBox.baseVal.y,
    width: map.viewBox.baseVal.width,
    height: map.viewBox.baseVal.height
};

let zoom = 1;

function updateZoom() {
    const width = originalView.width / zoom;
    const height = originalView.height / zoom;

    // Keep the zoom centred on the map.
    const x = originalView.x + (originalView.width - width) / 2;
    const y = originalView.y + (originalView.height - height) / 2;

    map.setAttribute("viewBox", `${x} ${y} ${width} ${height}`);
}

document.querySelector("#zoom-in").addEventListener("click", () => {
    zoom = Math.min(zoom * 1.25, 3);
    updateZoom();
});

document.querySelector("#zoom-out").addEventListener("click", () => {
    zoom = Math.max(zoom / 1.25, 1);
    updateZoom();
});

document.querySelector("#zoom-reset").addEventListener("click", () => {
    zoom = 1;
    updateZoom();
});
	</script>
